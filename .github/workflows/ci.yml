name: CI

# Unit tests (no network, no model download: ChromaDB gets a test embedding)
# plus an import smoke check. A dummy API key avoids import-time failures
# from client construction.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Test
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: pytest -q

      - name: Import smoke test
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: |
          python -c "import logscribe; print('logscribe package imports cleanly')"
          python -c "import cli; print('cli module imports cleanly')"
