[project]
name = "logscribe"
version = "0.1.0"
description = "Tail-based log monitoring with RAG-powered, AI root-cause analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "streamlit>=1.28",
]

[project.scripts]
logscribe = "cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["logscribe"]
